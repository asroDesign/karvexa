openapi: 3.1.0
info:
  title: Business OS — Central REST API Specification
  version: 1.0.0
  description: >
    Authoritative, non-negotiable API contract for Business OS (Android Offline Client,
    Admin Web Panel, and Modular Monolith Backend). All JSON fields use strict snake_case,
    all monetary/quantity/rate values are transmitted as Decimal Strings, all business dates
    use YYYY-MM-DD, and all system timestamps use ISO 8601 UTC.
servers:
  - url: /api/v1
    description: Business OS REST API v1
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationIdHeader:
      name: X-Organization-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: Active tenant UUID. Always verified server-side against organization_members.
    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
    ClientVersionHeader:
      name: X-Client-Version
      in: header
      required: false
      schema: { type: string, example: "1.0.0" }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPageParam:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SearchParam:
      name: search
      in: query
      schema: { type: string }
    StatusParam:
      name: status
      in: query
      schema: { type: string }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { type: object }
        meta:
          type: object
          required: [request_id, timestamp]
          properties:
            request_id: { type: string, format: uuid }
            timestamp: { type: string, format: date-time }
    PaginatedEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: { type: array, items: { type: object } }
        meta:
          type: object
          required: [pagination, request_id]
          properties:
            pagination:
              type: object
              required: [page, per_page, total, last_page]
              properties:
                page: { type: integer }
                per_page: { type: integer, maximum: 100 }
                total: { type: integer }
                last_page: { type: integer }
            request_id: { type: string, format: uuid }
            timestamp: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, code, message]
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
            request_id: { type: string, format: uuid }
    DecimalMoney:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]{1,2})?$"
      example: "1250000.00"
    DecimalQty:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]{1,4})?$"
      example: "2.5000"
    LoginRequest:
      type: object
      required: [password]
      properties:
        mobile: { type: string, example: "09121000001" }
        email: { type: string, format: email }
        password: { type: string }
        device:
          type: object
          properties:
            device_id: { type: string }
            platform: { type: string, example: "android" }
            app_version: { type: string, example: "1.0.0" }
            device_name: { type: string, example: "Samsung Galaxy S24" }
    ContactCreateRequest:
      type: object
      required: [code, display_name, type]
      properties:
        code: { type: string }
        type: { type: string, enum: [CUSTOMER, SUPPLIER, BOTH, EMPLOYEE, OTHER] }
        display_name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        company_name: { type: string }
        national_id: { type: string }
        economic_code: { type: string }
        mobile: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        address: { type: string }
        postal_code: { type: string }
        group_id: { type: string, format: uuid, nullable: true }
        credit_limit: { $ref: '#/components/schemas/DecimalMoney' }
        opening_balance: { $ref: '#/components/schemas/DecimalMoney' }
        notes: { type: string }
    ProductCreateRequest:
      type: object
      required: [code, name, base_unit_id]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        item_type: { type: string, enum: [PRODUCT, SERVICE, RAW_MATERIAL, FINISHED_PRODUCT] }
        category_id: { type: string, format: uuid, nullable: true }
        brand_id: { type: string, format: uuid, nullable: true }
        barcode: { type: string }
        base_unit_id: { type: string, format: uuid }
        purchase_price: { $ref: '#/components/schemas/DecimalMoney' }
        sale_price: { $ref: '#/components/schemas/DecimalMoney' }
        tax_rate: { $ref: '#/components/schemas/DecimalMoney' }
        minimum_stock: { $ref: '#/components/schemas/DecimalQty' }
        maximum_stock: { $ref: '#/components/schemas/DecimalQty' }
        track_inventory: { type: boolean, default: true }
        allow_negative_stock: { type: boolean, default: false }
        attributes: { type: object }
    JournalEntryCreateRequest:
      type: object
      required: [document_date, description, lines]
      properties:
        client_document_id: { type: string, format: uuid }
        fiscal_year_id: { type: string, format: uuid }
        accounting_period_id: { type: string, format: uuid }
        document_date: { type: string, format: date }
        description: { type: string }
        confirm_immediately: { type: boolean, default: false }
        lines:
          type: array
          minItems: 2
          items:
            type: object
            required: [account_id, debit, credit]
            properties:
              account_id: { type: string, format: uuid }
              contact_id: { type: string, format: uuid, nullable: true }
              cost_center_id: { type: string, format: uuid, nullable: true }
              description: { type: string }
              debit: { $ref: '#/components/schemas/DecimalMoney' }
              credit: { $ref: '#/components/schemas/DecimalMoney' }
    InvoiceCreateRequest:
      type: object
      required: [warehouse_id, document_date, items]
      properties:
        client_document_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        document_date: { type: string, format: date }
        due_date: { type: string, format: date }
        currency: { type: string, default: "IRR" }
        exchange_rate: { $ref: '#/components/schemas/DecimalQty' }
        discount_total: { $ref: '#/components/schemas/DecimalMoney' }
        tax_total: { $ref: '#/components/schemas/DecimalMoney' }
        shipping_cost: { $ref: '#/components/schemas/DecimalMoney' }
        other_costs: { $ref: '#/components/schemas/DecimalMoney' }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity, unit_price]
            properties:
              product_id: { type: string, format: uuid }
              quantity: { $ref: '#/components/schemas/DecimalQty' }
              unit_price: { $ref: '#/components/schemas/DecimalMoney' }
              description: { type: string }
    MarketVerifyRequest:
      type: object
      required: [package_name, sku, purchase_token]
      properties:
        package_name: { type: string, example: "ir.businessos.app" }
        sku: { type: string, example: "bos_pro_monthly" }
        purchase_token: { type: string }
paths:
  /auth/register:
    post:
      summary: Register a new Business OS user account
      security: []
      responses: { '201': { description: Registered }, '422': { description: Validation error } }
  /auth/login:
    post:
      summary: Authenticate via mobile/email and issue Bearer access + rotating refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated with Bearer token }
        '401': { description: Invalid credentials }
  /auth/refresh:
    post:
      summary: Rotate refresh token with reuse attack protection
      responses: { '200': { description: Rotated tokens }, '401': { description: Reuse or expired } }
  /auth/logout:
    post: { summary: Revoke current session, responses: { '200': { description: Logged out } } }
  /auth/logout-all:
    post: { summary: Revoke all active sessions of current user, responses: { '200': { description: Logged out all } } }
  /auth/me:
    get: { summary: Current user profile, verified organizations, RBAC permissions & entitlements, responses: { '200': { description: Profile } } }
    patch: { summary: Update profile or active organization context, responses: { '200': { description: Updated } } }
  /auth/sessions:
    get: { summary: List active and past sessions, responses: { '200': { description: Sessions } } }
  /auth/sessions/{id}:
    delete: { summary: Revoke specific session, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Revoked } } }
  /devices/register:
    post: { summary: Register stable Android device_id, responses: { '201': { description: Registered } } }
  /devices:
    get: { summary: List organization devices, responses: { '200': { description: Devices list } } }
  /devices/{id}/revoke:
    post: { summary: Revoke compromised device, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Revoked } } }
  /organizations:
    get: { summary: List organizations accessible by authenticated user, responses: { '200': { description: Organizations } } }
    post: { summary: Provision new organization with default chart of accounts & warehouse, responses: { '201': { description: Created } } }
  /organizations/{id}:
    get: { summary: Get verified organization details, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Organization } } }
    patch: { summary: Update organization profile, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Updated } } }
  /organizations/{id}/settings:
    get: { summary: Get organization accounting/inventory/currency settings, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Settings } } }
    patch: { summary: Update organization policies, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Updated } } }
  /organizations/{id}/members:
    get: { summary: List organization members, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Members } } }
    post: { summary: Add member to organization, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '201': { description: Added } } }
  /organizations/{id}/fiscal-years:
    get: { summary: List organization fiscal years and accounting periods, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Fiscal years } } }
    post: { summary: Create fiscal year, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '201': { description: Created } } }
  /roles:
    get: { summary: List roles, responses: { '200': { description: Roles } } }
    post: { summary: Create custom org role, responses: { '201': { description: Created } } }
  /permissions:
    get: { summary: List all granular system permissions, responses: { '200': { description: Permissions } } }
  /users:
    get: { summary: List organization users, responses: { '200': { description: Users } } }
  /contacts:
    get:
      summary: Paginated list of contacts with running balance
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SearchParam'
      responses: { '200': { description: Contacts list } }
    post:
      summary: Create contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreateRequest' }
      responses: { '201': { description: Created } }
  /contacts/{id}/balance:
    get: { summary: Compute contact balance from transactions, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Balance } } }
  /contacts/{id}/statement:
    get: { summary: Detailed contact account statement, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Statement } } }
  /products:
    get: { summary: Paginated catalog products with Stock Ledger on-hand totals, responses: { '200': { description: Products } } }
    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateRequest' }
      responses: { '201': { description: Created } }
  /products/barcode/{barcode}:
    get: { summary: Fast barcode lookup for Android scanner, parameters: [{ name: barcode, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Product } } }
  /warehouses:
    get: { summary: List warehouses, responses: { '200': { description: Warehouses } } }
    post: { summary: Create warehouse, responses: { '201': { description: Created } } }
  /inventory/stock:
    get: { summary: Live Stock Ledger balances and valuation, responses: { '200': { description: Stock valuation } } }
  /inventory/movements:
    get: { summary: Paginated Stock Ledger card movements, responses: { '200': { description: Movements } } }
  /inventory/transfers:
    get: { summary: List warehouse transfers, responses: { '200': { description: Transfers } } }
    post: { summary: Execute atomic source-out and destination-in warehouse transfer, responses: { '201': { description: Transferred } } }
  /inventory/counts:
    get: { summary: List stock counts, responses: { '200': { description: Counts } } }
    post: { summary: Submit & confirm stock count generating variance adjustment document, responses: { '201': { description: Count approved } } }
  /purchases:
    get: { summary: Paginated purchase invoices, responses: { '200': { description: Purchases } } }
    post:
      summary: Create draft purchase invoice
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceCreateRequest' } } } }
      responses: { '201': { description: Draft created } }
  /purchases/{id}/confirm:
    post: { summary: Atomically confirm purchase + Stock Receipt + Double-Entry Accounting Voucher, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Confirmed } } }
  /sales:
    get: { summary: Paginated sales invoices, responses: { '200': { description: Sales } } }
    post:
      summary: Create draft sales invoice
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceCreateRequest' } } } }
      responses: { '201': { description: Draft created } }
  /sales/{id}/confirm:
    post: { summary: Atomically confirm sale + Stock Issue + COGS & Revenue Journal Voucher, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Confirmed } } }
  /consignments:
    get: { summary: List consignment documents separated from owned inventory, responses: { '200': { description: Consignments } } }
    post: { summary: Create consignment document, responses: { '201': { description: Created } } }
  /consignments/{id}/settlements:
    post: { summary: Calculate commission and settle consignor payable, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '201': { description: Settled } } }
  /treasury/accounts:
    get: { summary: List bank accounts and cashboxes, responses: { '200': { description: Treasury accounts } } }
    post: { summary: Create treasury account, responses: { '201': { description: Created } } }
  /treasury/receipts:
    post: { summary: Record treasury cash/bank receipt, responses: { '201': { description: Receipt recorded } } }
  /treasury/payments:
    post: { summary: Record treasury payment, responses: { '201': { description: Payment recorded } } }
  /treasury/transfers:
    post: { summary: Transfer funds atomically between treasury accounts, responses: { '201': { description: Transfer recorded } } }
  /cheques:
    get: { summary: List receivable and payable cheques with event history, responses: { '200': { description: Cheques } } }
    post: { summary: Register cheque, responses: { '201': { description: Registered } } }
  /cheques/{id}/deposit:
    post: { summary: Record DEPOSITED cheque event, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Updated } } }
  /cheques/{id}/cash:
    post: { summary: Record CASHED cheque event, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Updated } } }
  /cheques/{id}/bounce:
    post: { summary: Record BOUNCED cheque event, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Updated } } }
  /accounting/accounts:
    get: { summary: Chart of accounts, responses: { '200': { description: Accounts } } }
    post: { summary: Create postable account, responses: { '201': { description: Created } } }
  /accounting/journal-entries:
    get: { summary: Paginated journal entries with double-entry lines, responses: { '200': { description: Journal entries } } }
    post:
      summary: Create draft or confirmed double-entry journal voucher
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JournalEntryCreateRequest' } } } }
      responses: { '201': { description: Created }, '409': { description: Unbalanced or closed period } }
  /accounting/journal-entries/{id}/confirm:
    post: { summary: Permanently confirm balanced draft voucher, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Confirmed } } }
  /accounting/journal-entries/{id}/reverse:
    post: { summary: Issue linked reversal voucher for immutable confirmed entry, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '201': { description: Reversed } } }
  /accounting/trial-balance:
    get: { summary: Ledger-reconstructed Trial Balance, responses: { '200': { description: Trial balance } } }
  /accounting/profit-loss:
    get: { summary: Ledger-reconstructed Profit & Loss statement, responses: { '200': { description: Profit and Loss } } }
  /accounting/balance-sheet:
    get: { summary: Ledger-reconstructed Balance Sheet, responses: { '200': { description: Balance sheet } } }
  /reports/dashboard:
    get: { summary: Organization executive KPIs and financial snapshot, responses: { '200': { description: Dashboard } } }
  /export:
    get: { summary: Always-accessible full tenant data export (never blocked on subscription expiry), responses: { '200': { description: Export JSON } } }
  /subscription/plans:
    get: { summary: List active plans and feature limits, responses: { '200': { description: Plans } } }
  /subscription/current:
    get: { summary: Current organization subscription and server-side entitlements, responses: { '200': { description: Current subscription } } }
  /subscription/market/verify:
    post:
      summary: Verify CafeBazaar purchase receipt server-side with mandatory Idempotency-Key
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MarketVerifyRequest' } } } }
      responses: { '200': { description: Verified }, '409': { description: Receipt replayed } }
  /subscription/market/restore:
    post: { summary: Restore valid CafeBazaar purchases for tenant, responses: { '200': { description: Restored } } }
  /files:
    post: { summary: Request validated presigned S3 upload for attachment, responses: { '201': { description: Upload initialized } } }
  /files/{id}/complete-upload:
    post: { summary: Mark S3 upload completed, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Completed } } }
  /sync/push:
    post: { summary: Push offline Android mutation batch with optimistic concurrency & conflict detection, responses: { '200': { description: Processed batch } } }
  /sync/pull:
    get: { summary: Pull delta records since checkpoint, responses: { '200': { description: Delta payload } } }
  /sync/status:
    get: { summary: Organization sync status, head cursor, device lag & sync_logs telemetry, responses: { '200': { description: Sync status } } }
  /sync/acknowledge:
    post: { summary: Acknowledge opaque cursor after Android Room transaction commits, responses: { '200': { description: Acknowledged } } }
  /sync/checkpoints:
    get: { summary: List device checkpoints, responses: { '200': { description: Checkpoints } } }
  /sync/reset-checkpoint:
    post: { summary: Protected non-destructive checkpoint reset, responses: { '200': { description: Reset } } }
  /sync/conflicts/{id}/resolve:
    post: { summary: Domain-restricted conflict resolution (USE_SERVER / USE_LOCAL / MERGE / RECREATE_AS_NEW), parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Resolved }, '409': { description: Resolution forbidden for entity } } }
  /personal-finance/dashboard:
    get: { summary: Dedicated Personal Finance Dashboard (requires personal_finance.view), responses: { '200': { description: Personal finance summary }, '403': { description: Permission denied } } }
  /personal-finance/withdrawals:
    post: { summary: Record Owner Withdrawal (DR Owner Drawings 3201 / CR Cash or Bank; never impacts business P&L), responses: { '201': { description: Withdrawal posted } } }
  /personal-finance/contributions:
    post: { summary: Record Owner Contribution to business, responses: { '201': { description: Contribution posted } } }
  /personal-finance/transactions:
    get: { summary: List personal ledger transactions, responses: { '200': { description: Transactions } } }
    post: { summary: Create personal expense/income optionally linked to an OwnerWithdrawal, responses: { '201': { description: Created } } }
  /personal-finance/recurring:
    get: { summary: List recurring personal obligations, responses: { '200': { description: Obligations } } }
    post: { summary: Define recurring obligation without auto-posting payment, responses: { '201': { description: Created } } }
  /personal-finance/recurring/{id}/pay:
    post: { summary: Record idempotent payment of a recurring obligation, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Paid } } }
  /accounting-categories:
    get: { summary: List expense/income categories with automatic GL account mappings, responses: { '200': { description: Categories } } }
    post: { summary: Create accounting category with optional mapping, responses: { '201': { description: Created } } }
  /quick-transactions:
    get: { summary: List rapid expense/income transactions, responses: { '200': { description: Quick transactions } } }
    post: { summary: Post quick expense or income with automatic category-to-GL double-entry journal, responses: { '201': { description: Posted }, '422': { description: Missing category account mapping } } }
  /variants:
    get: { summary: List product variants with independent Stock Ledger balances and parent projection, responses: { '200': { description: Variants } } }
    post: { summary: Create product variant, responses: { '201': { description: Created } } }
  /opening-stock:
    post: { summary: Post opening stock document for product or variant with opening accounting voucher, responses: { '201': { description: Opening stock posted } } }
  /replenishment/thresholds:
    get: { summary: List warehouse reorder thresholds, responses: { '200': { description: Thresholds } } }
    post: { summary: Configure product/variant warehouse reorder threshold, responses: { '201': { description: Saved } } }
  /replenishment/suggestions:
    get: { summary: Compute explainable smart purchase recommendations factoring in incoming POs, responses: { '200': { description: Suggestions } } }
  /replenishment/suggestions/{id}/convert-po:
    post: { summary: Convert accepted purchase suggestion into a single non-duplicate Purchase Order, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '201': { description: Converted to PO } } }
  /purchase-orders:
    get: { summary: List purchase orders with items, responses: { '200': { description: Purchase orders } } }
    post: { summary: Create purchase order, responses: { '201': { description: Created } } }
  /quotations:
    get: { summary: List quotations/proforma invoices, responses: { '200': { description: Quotations } } }
    post: { summary: Create quotation (zero accounting/stock effect), responses: { '201': { description: Created } } }
  /quotations/{id}/convert:
    post: { summary: Convert quotation to draft sales invoice, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '201': { description: Converted } } }
  /crm/customers:
    get: { summary: Customer CRM profiles with segmentation, receivables & immutable loyalty balance, responses: { '200': { description: CRM profiles } } }
  /crm/loyalty/transactions:
